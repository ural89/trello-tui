[package]
name = "trello-tui"
version = "0.1.0"
edition = "2024"
description = "Keyboard-driven Trello client for the terminal with vim-style bindings"
license = "MIT"
repository = "https://github.com/ural89/trello-tui"
readme = "README.md"
keywords = ["trello", "tui", "vim", "terminal", "kanban"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
dirs = "7.0.0"
ratatui = "0.30.2"
ratatui-textarea = "0.9.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
